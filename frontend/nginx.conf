# frontend/nginx.conf  ── minimal, SPA‑friendly
server {
    listen 80;
    server_name _;              # dokku injects the real host header

    root /usr/share/nginx/html; # where the Vite build is copied
    index index.html;

    # ------ app paths -------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------ static assets ---------
    location ~* \.(?:css|js|svg|gif|png|jpg|jpeg|ico|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
