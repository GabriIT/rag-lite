server {
    listen 80;
    server_name _;          # Dokku injects its own hostname anyway

    root /usr/share/nginx/html;
    index index.html;

    # 2. All other paths go to index.html (client‑side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1. Cache‑forever static assets produced by Vite/React
    location ~* \.(?:css|js|svg|gif|png|jpg|jpeg|ico|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
        
    }

    
}
